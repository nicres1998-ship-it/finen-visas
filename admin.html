<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Administración FINEN</title><style>body{background:#edf5f3;color:#203e3c;font:16px system-ui;margin:0}main{max-width:850px;margin:24px auto;background:white;padding:24px;border-radius:14px}img{max-width:200px}label{display:block;margin:12px 0}input,button{font:inherit;padding:10px;border:1px solid #aabbb8;border-radius:6px;box-sizing:border-box}input{width:100%}button{background:#205b53;color:white;cursor:pointer;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}article{border-top:1px solid #ddd;padding:12px 0}[hidden]{display:none!important}</style><main><img src="assets/logo-finen.png" alt="FINEN"><h1>Administración de referencias</h1><form id="login"><label>Correo<input type="email" id="email" required></label><label>Contraseña<input id="password" type="password" required></label><button>Ingresar</button></form><p id="msg" role="status"></p><section id="panel" hidden><button id="logout">Cerrar sesión</button><h2>Nueva referencia</h2><p>Emisión disponible únicamente con cuentas autorizadas activas. No utilizar documentos de prueba para pagos.</p><label>Importar ficha PDF rellenada en Chrome<input type="file" id="pdf" accept="application/pdf"></label><p id="pdfmsg" role="status"></p><form id="create"><label>Titular<input id="cliente" required></label><label>Folio de contrato<input id="contrato"></label><label>Concepto<input id="concepto" required></label><label>Importe MXN<input id="importe" type="number" min="0.01" step="0.01" required></label><label>Importe en letra<input id="letra" required></label><label>Vencimiento<input id="vence" type="date" required></label><label>Observaciones<input id="obs"></label><button>Registrar referencia</button></form><pre id="out"></pre><h2>Historial</h2><button id="refresh">Actualizar</button><div id="history"></div></section></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script>const $=x=>document.getElementById(x),base='https://upbcsdocsoicujeylpmx.supabase.co',key='sb_publishable_wOqfHlkJATss_6Ow_6jgaw_GepOkl6s';let token='';async function req(path,body){const headers={apikey:key,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch(base+path,{method:body===undefined?'GET':'POST',headers,body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.message||d.msg||'Error de consulta');return d}const rpc=(n,b={})=>req('/rest/v1/rpc/'+n,b);function msg(s){$('msg').textContent=s}function reset(){token='';$('panel').hidden=true;$('login').hidden=false;$('history').replaceChildren();$('out').textContent=''}$('login').onsubmit=async e=>{e.preventDefault();try{const d=await req('/auth/v1/token?grant_type=password',{email:$('email').value,password:$('password').value});token=d.access_token;$('password').value='';if(await rpc('finen_rol_actual')!=='ADMIN')throw Error('Acceso no autorizado');$('login').hidden=true;$('panel').hidden=false;msg('Sesión administrativa iniciada');await historyLoad()}catch(e){reset();msg(e.message)}};$('logout').onclick=async()=>{try{await req('/auth/v1/logout',{})}catch{}reset();msg('Sesión cerrada')};$('create').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const d=await rpc('finen_generar_referencia',{p_cliente:$('cliente').value,p_folio_contrato:$('contrato').value,p_concepto:$('concepto').value,p_importe:Number($('importe').value),p_importe_letra:$('letra').value,p_fecha_vencimiento:$('vence').value,p_observaciones:$('obs').value});$('out').textContent='Referencia registrada: '+d.folio+'\nEnlace: '+location.origin+'/verificar.html#token='+encodeURIComponent(d.token_qr);e.target.reset();await historyLoad()}catch(e){msg(e.message)}finally{b.disabled=false}};async function historyLoad(){try{const rows=await req('/rest/v1/finen_referencias?select=id,folio,cliente,importe,estatus,token_qr&limit=100');$('history').replaceChildren();for(const r of rows){const a=document.createElement('article'),p=document.createElement('p'),link=document.createElement('a');p.textContent=[r.folio,r.cliente,r.importe,r.estatus].join(' · ');link.textContent='Abrir verificador';link.href='verificar.html#token='+encodeURIComponent(r.token_qr);link.target='_blank';link.rel='noopener noreferrer';a.append(p,link);if(r.estatus==='PENDIENTE')for(const status of ['PAGADA','CANCELADA']){const b=document.createElement('button');b.textContent=status==='PAGADA'?'Confirmar pago':'Cancelar';b.onclick=async()=>{if(!confirm('Cambiar estado a '+status+'?'))return;const motivo=status==='CANCELADA'?prompt('Motivo de cancelación'):null;if(status==='CANCELADA'&&!motivo)return;try{await rpc('finen_cambiar_estatus',{p_id:r.id,p_estatus:status,p_motivo:motivo});await historyLoad()}catch(e){msg(e.message)}};a.append(b)}$('history').append(a)}}catch(e){msg(e.message)}}$('refresh').onclick=historyLoad;$('pdf').onchange=async()=>{try{const file=$('pdf').files[0];if(!file)return;const doc=await PDFLib.PDFDocument.load(await file.arrayBuffer());const form=doc.getForm();const get=n=>(form.getTextField(n).getText()||'').trim();const values={cliente:get('nombre'),contrato:get('contrato'),concepto:get('concepto'),importe:get('importe').replace(/[$,\s]/g,''),letra:get('letra')};const v=get('vence');values.vence=/^\d{2}\/\d{2}\/\d{4}$/.test(v)?v.split('/').reverse().join('-'):v;for(const [k,val] of Object.entries(values))$(k).value=val;$('pdfmsg').textContent='Ficha leída. Revisa los datos antes de registrar. El folio definitivo lo asigna el servidor.'}catch(e){$('pdfmsg').textContent='No se pudo leer la ficha editable: '+e.message}};</script></html>
