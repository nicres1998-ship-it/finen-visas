<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Administración | FINEN VISA ADVISORY</title>
  <script defer src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"
    integrity="sha384-weMABwrltA6jWR8DDe9Jp5blk+tZQh7ugpCsF3JwSA53WZM9/14PjS5LAJNHNjAIx"
    crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.js"
    integrity="sha384-e9EFD6BGC90bkW9aDV5xbbBfzwN7G8YImHao2lfLVKV/hPB0E0go+H3I64h7oHtA"
    crossorigin="anonymous"></script>
  <script type="module" src="assets/admin-references.mjs"></script>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #183747; background: #f1f7f7 }
    * { box-sizing: border-box }
    [hidden] { display: none !important }
    body { margin: 0 }
    header { background: #fff; border-bottom: 1px solid #d5e5e5 }
    header div, main { max-width: 68rem; margin: auto; padding: 1rem }
    header div, .actions { display: flex; flex-wrap: wrap; align-items: center; gap: .65rem }
    header img { width: 7rem; height: auto }
    header button { margin-left: auto }
    h1, h2 { line-height: 1.15; margin-top: 0 }
    section, #login { background: #fff; padding: clamp(1rem,3vw,2rem); border: 1px solid #d5e5e5; border-radius: .8rem; margin-bottom: 1rem }
    #login { max-width: 26rem; margin-inline: auto }
    label { display: block; font-weight: 650; margin-bottom: .75rem }
    input, button, .download { font: inherit; border: 1px solid #789298; border-radius: .4rem; padding: .55rem .7rem }
    input { display: block; width: 100%; margin-top: .3rem; max-width: 30rem }
    button, .download { background: #0a5e62; color: #fff; cursor: pointer; text-decoration: none }
    button:disabled { background: #e0e9e9; color: #455e62; cursor: default }
    .secondary { background: #fff; color: #0a5e62 }
    a { color: #0a5e62 }
    dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr)); gap: .7rem }
    dt { font-weight: 650 }
    dd { margin: 0; overflow-wrap: anywhere }
    .scroll { overflow: auto }
    table { width: 100%; border-collapse: collapse; text-align: left }
    th, td { padding: .6rem; border-bottom: 1px solid #d5e5e5 }
    #message[data-error] { color: #a32727 }
  </style>
</head>
<body>
  <header><div>
    <img src="assets/logo-finen.png" alt="FINEN VISA ADVISORY">
    <strong>Administración</strong>
    <button class="secondary" id="logout" hidden>Cerrar sesión</button>
  </div></header>
  <main>
    <p id="message" role="status" aria-live="polite"></p>
    <form id="login">
      <h1>Acceso administrativo</h1>
      <label>Usuario (correo electrónico)
        <input name="email" type="email" autocomplete="username" required>
      </label>
      <label>Contraseña
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button>Iniciar sesión</button>
    </form>
    <div id="panel" hidden>
      <section aria-labelledby="issue-title">
        <h1 id="issue-title">Emitir referencia desde PDF</h1>
        <label>Ficha de pago rellenada
          <input id="pdf" type="file" accept="application/pdf,.pdf">
        </label>
        <dl id="fields" hidden></dl>
        <div class="actions">
          <button id="issue" disabled>Guardar y generar QR</button>
          <a class="download" id="download" hidden>Descargar PDF definitivo</a>
        </div>
      </section>
      <section aria-labelledby="history-title">
        <h2 id="history-title">Referencias</h2>
        <label>Buscar por folio o titular
          <input id="search" type="search">
        </label>
        <div class="actions">
          <button class="secondary" id="refresh">Consultar</button>
          <button class="secondary" id="prev" disabled>Anterior</button>
          <button class="secondary" id="next" disabled>Siguiente</button>
          <span id="page-number" role="status"></span>
        </div>
        <div class="scroll">
          <table>
            <thead><tr><th>Folio</th><th>Titular</th><th>Importe</th><th>Estatus</th><th>Acciones</th></tr></thead>
            <tbody id="history"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
