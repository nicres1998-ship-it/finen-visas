<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Verificar ficha de pago | FINEN</title>
  <script type="module" src="assets/verificar-ficha.mjs"></script>
  <style>
    :root { font: 16px/1.5 system-ui, sans-serif; color: #17353e; background: #edf3f1 }
    * { box-sizing: border-box }
    [hidden] { display: none !important }
    body { margin: 0; padding: 1rem }
    main { max-width: 36rem; margin: 1.5rem auto; padding: clamp(1.1rem, 5vw, 2rem); background: #fffdf7;
      border: 1px solid #ddd9ca; border-radius: 1rem; box-shadow: 0 12px 36px #1232 }
    header { text-align: center }
    header img { width: 10rem; max-width: 100%; height: auto }
    h1 { margin: .65rem 0; font-size: clamp(1.3rem, 6vw, 1.9rem); line-height: 1.2 }
    #stamp {
      position: relative; isolation: isolate; display: grid; place-items: center;
      width: min(13.5rem, 88%); aspect-ratio: 1.45; margin: 1.4rem auto;
      padding: 1rem 1.25rem; border: 4px double currentColor; border-radius: 48%;
      color: #38617d; font: bold clamp(1.1rem, 5vw, 1.55rem)/1.05 Georgia, serif;
      letter-spacing: .08em; text-transform: uppercase; transform: rotate(-8deg);
      background: repeating-linear-gradient(3deg, #627e9624 0 1px, transparent 1px 5px);
    }
    #stamp::after { content: ""; position: absolute; inset: .24rem; pointer-events: none; border: 1px dashed; border-radius: inherit; opacity: .62 }
    #stamp[data-state="invalid"] { color: #8e3434 }
    #notice { margin: .5rem 0 1.25rem; text-align: center; font-weight: 650 }
    dl { margin: 1rem 0 }
    dl div { display: grid; grid-template-columns: minmax(6rem, 40%) 1fr; gap: .5rem; padding: .55rem 0; border-bottom: 1px solid #e8e2d3 }
    dt { font-weight: 650 }
    dd { margin: 0; overflow-wrap: anywhere }
    form { display: grid; gap: .65rem }
    form label { display: grid; gap: .25rem }
    input, button { font: inherit; padding: .55rem }
    footer { margin-top: 1.2rem; text-align: center; font-size: .95rem }
    a { color: #235575; font-weight: 650 }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="assets/logo-finen.png" alt="FINEN VISA ADVISORY">
      <div id="stamp" aria-hidden="true" hidden></div>
      <h1 id="title" role="status">Verificando ficha de pago…</h1>
    </header>
    <p id="notice" hidden></p>
    <form id="lookup" hidden>
      <label>Folio de la ficha<input name="folio" required maxlength="40"></label>
      <label>Titular tal como aparece en la ficha<input name="cliente" required maxlength="200"></label>
      <button>Verificar ficha</button>
    </form>
    <dl id="details" hidden></dl>
    <footer>Para cualquier verificación, comunícate al número oficial <a href="tel:+522711299509">271 129 9509</a>.</footer>
  </main>
</body>
</html>
