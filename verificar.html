<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <title>Verificar ficha de pago | FINEN</title>
  <script type="module" src="assets/verificar-ficha.mjs?v=tarjeta3"></script>
  <style>
    :root { font: 16px/1.55 system-ui, sans-serif; color: #172a35; background: #edf2f4 }
    * { box-sizing: border-box }
    [hidden] { display: none !important }
    body { margin: 0; padding: clamp(.8rem, 4vw, 2.5rem); min-height: 100vh;
      background: radial-gradient(ellipse at top, #dcebec, transparent 65%) }
    main { max-width: 40rem; margin: auto; overflow: hidden; background: #fff;
      border: 1px solid #d9e4e7; border-radius: 1.4rem; box-shadow: 0 18px 52px #183d4c18 }
    header { text-align: center; padding: clamp(1.25rem, 5vw, 2rem);
      background: linear-gradient(160deg, #fff 20%, #eff8f7); border-bottom: 1px solid #deebeb }
    header img { width: 8.25rem; max-width: 100%; height: auto }
    .issuer { margin: .6rem auto 0; color: #315661; font-size: .88rem; font-weight: 650 }
    h1 { max-width: 24ch; margin: .55rem auto 0; font: 700 clamp(1.7rem, 6vw, 2.35rem)/1.12 Georgia, serif }
    #stamp { display:grid; place-items:center; width:4.2rem; height:4.2rem; margin:.85rem auto;
      border-radius:50%; background:#dff4eb; color:#137252; font:700 2.45rem/1 system-ui;
      border:1px solid #acdcca; box-shadow:0 0 0 .35rem #f0faf5 }
    #stamp[data-state="invalid"] { background:#faeaec; color:#922e38; border-color:#efc1c8; box-shadow:none }
    main[data-state="valid"] { border-top:4px solid #188368 }
    .content { padding: clamp(1rem, 5vw, 2rem) }
    #notice { margin: 0 0 1.15rem; padding: .8rem 1rem; border-left: 3px solid #418084;
      border-radius: .45rem; background: #eff7f6; color: #254c51 }
    main[data-state="invalid"] #notice { background: #fff1f2; border-color: #a43d48; color: #752631 }
    dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .75rem; margin: 0 }
    dl div { padding: .7rem .85rem; background: #f5f8fa; border: 1px solid #e8eef0; border-radius: .65rem }
    dl div[data-field="cliente"], dl div[data-field="concepto"], dl div[data-field="deposito"] { grid-column: 1 / -1 }
    dl div[data-field="importe"] { background: #eaf5f3; border-color: #dceee9 }
    dl div[data-field="importe"] dd { color: #124c50; font-size: 1.25rem }
    dt { color: #475e6a; font-size: .78rem; font-weight: 700 }
    dd { margin: .15rem 0 0; font-weight: 650; overflow-wrap: anywhere }
    form { display: grid; gap: .85rem }
    form label { display: grid; gap: .3rem; font-weight: 600 }
    input, button { min-width: 0; font: inherit; padding: .65rem .8rem; border: 1px solid #9cb3ba; border-radius: .55rem }
    button { background: #164d57; border-color: #164d57; color: white; font-weight: 700; cursor: pointer }
    footer { padding: 1rem; text-align: center; color: #435d68; font-size: .88rem;
      border-top: 1px solid #e2eaed; background: #f7fafb }
    a { color: #174f61; font-weight: 750 }
    @media (max-width: 350px) { dl { grid-template-columns: 1fr } }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="assets/logo-finen.png" alt="FINEN VISA ADVISORY">
      <div id="stamp" aria-hidden="true" hidden></div>
      <h1 id="title" role="status">Verificando ficha de pago…</h1>
      <p class="issuer" id="issuer" hidden>Emitida por FINEN, ADVISORY SERVICES, S.A. DE C.V.</p>
    </header>
    <div class="content">
    <p id="notice" hidden></p>
    <form id="lookup" hidden>
      <label>Folio de la ficha<input name="folio" required maxlength="40"></label>
      <label>Titular tal como aparece en la ficha<input name="cliente" required maxlength="200"></label>
      <button>Verificar ficha</button>
    </form>
    <dl id="details" hidden></dl>
    </div>
    <footer>Para cualquier verificación, comunícate al número oficial <a href="tel:+522711299509">271 129 9509</a>.</footer>
  </main>
</body>
</html>
